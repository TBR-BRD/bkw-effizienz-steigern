calculate_setpoints:
  name: Calculate setpoints
  description: Calculate WR1 and WR2 power setpoints for the BKW controller.
  fields:
    grid_power_w:
      required: true
      example: 480
      selector:
        number:
          min: -2000
          max: 5000
          step: 1
          unit_of_measurement: W
    wr1_actual_w:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 800
          step: 1
          unit_of_measurement: W
    wr2_actual_w:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 800
          step: 1
          unit_of_measurement: W
    battery_soc_pct:
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    grid_target_w:
      required: false
      default: 15
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: W
