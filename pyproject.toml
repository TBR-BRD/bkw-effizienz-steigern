[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bkw-effizienz-steigern"
version = "0.1.0"
description = "Regelalgorithmus fuer Balkonkraftwerk-Effizienzsteigerung mit zwei Wechselrichtern"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "TBR-BRD"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
